<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tournament Board</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#06231B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tournament">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#06231B; --board:#0C3A2D; --edge:#1B5C46;
  --brass:#D4A62A; --chalk:#F1EEE2; --mute:#7FA394; --red:#C0392B;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(120% 80% at 50% 0%,#0E4433 0%,var(--deep) 62%) var(--deep);
  color:var(--chalk);font-family:'Archivo',system-ui,sans-serif;
  padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
}
.wrap{max-width:760px;margin:0 auto}

/* masthead */
.eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--mute)}
.eyebrow .dot{width:3px;height:3px;border-radius:50%;background:var(--brass)}
#title{width:100%;background:transparent;border:0;padding:6px 0 2px;color:var(--chalk);
  font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
  font-size:clamp(1.9rem,8.5vw,3.2rem);line-height:1.02}
#title:focus{outline:none;color:var(--brass)}
.brass-rule{height:2px;margin:10px 0 20px;background:linear-gradient(90deg,var(--brass),rgba(212,166,42,.15))}

/* tabs */
.tabs{display:flex;gap:2px;background:rgba(0,0,0,.25);padding:3px;border-radius:2px;margin-bottom:20px}
.tab{flex:1;border:0;background:transparent;color:var(--mute);padding:11px 4px;cursor:pointer;
  font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;border-radius:1px}
.tab:hover{color:var(--chalk)}
.tab.on{background:var(--board);color:var(--brass);box-shadow:inset 0 1px 0 var(--edge)}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.stack{display:flex;flex-direction:column;gap:12px}

/* leaderboard slats */
.slat{background:linear-gradient(180deg,var(--board),#093025);border-top:1px solid var(--edge);
  border-bottom:1px solid rgba(0,0,0,.4);border-radius:2px;padding:14px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.slat.lead{box-shadow:0 2px 0 rgba(0,0,0,.3),inset 3px 0 0 var(--brass)}
.slat-top{display:flex;align-items:center;gap:12px}
.pos{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--brass);min-width:26px}
.slat-name{flex:1;margin:0;font-family:'Oswald',sans-serif;font-weight:500;font-size:1.15rem;
  text-transform:uppercase;letter-spacing:.045em;line-height:1.1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plates{display:inline-flex;gap:3px;align-items:flex-end}
.plate{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:40px;padding:0 4px;
  background:linear-gradient(180deg,#E8BE41,#B98D18);color:#1A1206;border-radius:1px;
  font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:22px;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.4);animation:hang .28s cubic-bezier(.2,.8,.3,1)}
.plate.dot{background:none;box-shadow:none;color:var(--brass);min-width:6px;align-items:flex-end}
@keyframes hang{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.break{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;
  background:rgba(0,0,0,.28);border:1px solid rgba(27,92,70,.7);padding:4px 7px;border-radius:1px}
.chip b{color:var(--mute);font-weight:500;text-transform:uppercase;margin-right:5px}
.chip em{color:var(--mute);font-style:normal}
.roster-line{margin-top:9px;font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:12px;color:var(--mute);margin:4px 2px 0;line-height:1.5}

/* panels */
.panel{background:rgba(0,0,0,.2);border:1px solid rgba(27,92,70,.55);border-radius:2px;padding:16px 14px}
.panel-h{margin:0 0 4px;font-family:'Oswald',sans-serif;font-weight:500;font-size:15px;
  text-transform:uppercase;letter-spacing:.1em;color:var(--brass)}
.panel-sub{margin:0 0 14px;font-size:12.5px;color:var(--mute);line-height:1.5}

/* golf */
.score-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(27,92,70,.4)}
.score-row:last-child{border-bottom:0}
.score-team{flex:1;font-family:'Oswald',sans-serif;font-size:14px;text-transform:uppercase;
  letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-input{width:72px;text-align:center;background:rgba(0,0,0,.35);color:var(--chalk);
  border:1px solid var(--edge);border-bottom:2px solid var(--brass);border-radius:1px;
  font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;padding:7px 4px}
.score-input:focus{outline:none;background:rgba(0,0,0,.55)}
.score-pts{width:62px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--brass)}
.pts-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pts-cell{display:flex;flex-direction:column;gap:5px}
.pts-cell span{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--mute);text-align:center}
.pts-cell input{width:100%;text-align:center;background:rgba(0,0,0,.35);color:var(--chalk);
  border:1px solid var(--edge);border-radius:1px;padding:8px 2px;
  font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600}
.pts-cell input:focus{outline:none;border-color:var(--brass)}

/* games */
.gchips{display:flex;gap:6px;flex-wrap:wrap}
.gchip{background:rgba(0,0,0,.25);border:1px solid rgba(27,92,70,.7);color:var(--mute);
  padding:8px 13px;border-radius:1px;cursor:pointer;
  font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase}
.gchip.on{background:var(--board);border-color:var(--brass);color:var(--brass)}
.game-head{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.game-name{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--edge);
  color:var(--chalk);font-family:'Oswald',sans-serif;font-size:19px;text-transform:uppercase;
  letter-spacing:.06em;padding:2px 0 5px}
.game-name:focus{outline:none;border-color:var(--brass)}
.match{display:flex;gap:6px;margin-bottom:6px}
.side{flex:1;min-width:0;background:rgba(0,0,0,.28);border:1px solid rgba(27,92,70,.7);color:var(--chalk);
  padding:12px 8px;border-radius:1px;cursor:pointer;font-family:'Oswald',sans-serif;font-size:13px;
  letter-spacing:.04em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side:hover{border-color:var(--brass)}
.side.win{background:linear-gradient(180deg,#E8BE41,#B98D18);color:#1A1206;border-color:#B98D18;font-weight:500}
.side.lose{opacity:.42}
.vs{display:flex;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--mute);letter-spacing:.1em}
.lineup{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.lineup .side{flex:1 1 calc(50% - 3px);min-width:0}
.lineup .side:only-child{flex-basis:100%}
.brsec{margin-bottom:14px}
.brsec-h{margin:0 0 8px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--mute);font-weight:500}
.brmatch{margin-bottom:8px}
.brmatch.pend{opacity:.5}
.brlabel{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.side.tbd{flex:1 1 calc(50% - 3px);display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.18);border:1px dashed rgba(27,92,70,.6);color:var(--mute);
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;padding:12px 8px}
.pair-row{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid rgba(27,92,70,.3)}
.pair-row:last-child{border-bottom:0}
.pair-name{width:45%;font-family:'Oswald',sans-serif;font-size:13px;text-transform:uppercase;
  letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pair-players{flex:1;font-size:12.5px;color:var(--mute)}
.seg-b.wide{width:auto;padding:8px 11px;font-family:'Oswald',sans-serif;font-size:11.5px;
  letter-spacing:.08em;text-transform:uppercase}
.rec-row{display:flex;gap:6px;align-items:stretch;margin-bottom:6px}
.rec-open{flex:1;min-width:0;text-align:left;background:rgba(0,0,0,.28);
  border:1px solid rgba(27,92,70,.7);border-radius:1px;padding:11px 12px;cursor:pointer}
.rec-open:hover{border-color:var(--brass)}
.rec-word{display:block;font-family:'IBM Plex Mono',monospace;font-size:13px;
  letter-spacing:.06em;color:var(--brass)}
.rec-title{display:block;margin-top:3px;font-family:'Archivo',sans-serif;font-size:12px;
  color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-x{width:42px;background:transparent;border:1px solid rgba(27,92,70,.7);border-radius:1px;
  color:var(--mute);font-size:18px;cursor:pointer;line-height:1}
.rec-x:hover{color:var(--red);border-color:var(--red)}
.rules-h{flex:1;font-family:'Oswald',sans-serif;font-size:15px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--brass)}
.rules-body{white-space:pre-wrap;font-size:13.5px;line-height:1.6;color:var(--chalk)}
.rules-area{width:100%;min-height:150px;resize:vertical;background:rgba(0,0,0,.35);
  border:1px solid var(--edge);border-radius:1px;color:var(--chalk);padding:11px;
  font-family:'Archivo',sans-serif;font-size:13.5px;line-height:1.6}
.rules-area:focus{outline:none;border-color:var(--brass)}
.gstand{padding:9px 0;border-bottom:1px solid rgba(27,92,70,.35)}
.gstand:last-child{border-bottom:0}
.gstand-top{display:flex;align-items:center;gap:10px}
.gstand-pts{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;color:var(--brass);
  min-width:34px;text-align:right}
.gstand .owed-list{margin-top:5px;font-size:11.5px;color:var(--mute)}
.fmt-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(27,92,70,.35)}
.fmt-label{flex:1;font-size:13px;color:var(--chalk)}
.seg{display:flex;gap:3px}
.seg-b{width:36px;padding:8px 0;background:rgba(0,0,0,.3);border:1px solid rgba(27,92,70,.7);
  color:var(--mute);border-radius:1px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:13px}
.seg-b.on{background:var(--brass);border-color:var(--brass);color:#1A1206;font-weight:600}
.fmt-input{width:74px;text-align:center;background:rgba(0,0,0,.35);color:var(--chalk);
  border:1px solid var(--edge);border-radius:1px;padding:8px 4px;
  font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600}
.fmt-input:focus{outline:none;border-color:var(--brass)}
.fmt-note{margin:11px 0 0;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  letter-spacing:.08em;color:var(--brass)}

.round{border:1px solid rgba(27,92,70,.55);border-radius:2px;padding:11px 10px 9px;margin-bottom:9px;
  background:rgba(0,0,0,.16)}
.round-now{border-color:var(--brass);background:rgba(212,166,42,.07);box-shadow:inset 3px 0 0 var(--brass)}
.round-done{opacity:.62}
.round-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.round-n{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--chalk)}
.round-tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.round-now .round-tag{color:var(--brass)}
.bye{margin-top:7px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--mute)}
.owed-row{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid rgba(27,92,70,.35)}
.owed-row:last-child{border-bottom:0}
.owed-name{width:38%;font-family:'Oswald',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.04em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.owed-list{flex:1;font-size:12.5px;color:var(--chalk);line-height:1.45}
.owed-list.clear{color:var(--mute);font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em}

/* help */
.help-btn{background:transparent;border:1px solid rgba(27,92,70,.7);color:var(--mute);border-radius:1px;
  padding:9px 13px;cursor:pointer;font-family:'Oswald',sans-serif;font-size:12px;
  letter-spacing:.1em;text-transform:uppercase}
.help-btn:hover,.help-btn.on{border-color:var(--brass);color:var(--brass)}
.help ol{margin:0;padding-left:20px}
.help li{font-size:13.5px;line-height:1.65;margin-bottom:9px;color:var(--chalk)}
.help li b{color:var(--brass);font-weight:500}
.help .last{color:var(--mute);font-size:12.5px;line-height:1.55;margin:12px 0 0}

.wins-panel{margin-top:18px;border-top:1px solid rgba(27,92,70,.5);padding-top:14px}
.wins-h{margin:0 0 10px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--mute);font-weight:500}
.wins-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.wins-name{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wins-num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);width:34px;text-align:right}
.tally{display:inline-flex;gap:4px;height:16px}
.tally i{display:block;width:2px;height:16px;background:var(--brass);transform:skewX(-8deg)}
.tally.empty{color:var(--edge);font-size:12px}
.add-row{display:flex;gap:8px}
.text-input{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--edge);border-radius:1px;
  color:var(--chalk);padding:11px 10px;font-family:'Archivo',sans-serif;font-size:14px}
.text-input:focus{outline:none;border-color:var(--brass)}
.solid{background:var(--brass);border:0;color:#1A1206;padding:11px 18px;border-radius:1px;cursor:pointer;
  font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.ghost{background:transparent;border:1px solid var(--edge);color:var(--mute);padding:9px 14px;
  border-radius:1px;cursor:pointer;font-family:'Oswald',sans-serif;font-size:12px;
  letter-spacing:.1em;text-transform:uppercase}
.ghost:hover{color:var(--chalk);border-color:var(--mute)}
.ghost.danger:hover{color:var(--red);border-color:var(--red)}

/* teams */
.team-name{width:100%;background:transparent;border:0;border-bottom:1px solid var(--edge);color:var(--brass);
  font-family:'Oswald',sans-serif;font-size:18px;text-transform:uppercase;letter-spacing:.07em;
  padding:0 0 8px;margin-bottom:12px}
.team-name:focus{outline:none;border-color:var(--brass)}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.player-input{background:rgba(0,0,0,.3);border:1px solid rgba(27,92,70,.6);border-radius:1px;
  color:var(--chalk);padding:10px;font-family:'Archivo',sans-serif;font-size:13.5px;min-width:0}
.player-input:focus{outline:none;border-color:var(--brass)}

/* draw */
.pool-area{width:100%;min-height:150px;resize:vertical;background:rgba(0,0,0,.35);
  border:1px solid var(--edge);border-radius:1px;color:var(--chalk);padding:11px;
  font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.7}
.pool-area:focus{outline:none;border-color:var(--brass)}
.pool-bar{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);letter-spacing:.08em;margin-right:auto}
.count.full{color:var(--brass)}

.ghost.armed,.solid.armed{background:var(--red);border-color:var(--red);color:#fff}
.pool-msg{width:100%;margin-top:9px;font-family:'IBM Plex Mono',monospace;font-size:11px;
  letter-spacing:.06em;color:var(--brass);min-height:14px}

.share-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.code{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);border:1px solid rgba(27,92,70,.7);padding:5px 8px;border-radius:1px}
.share-msg{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--brass);flex:1;min-width:0}
.share-url{width:100%;margin-top:8px;background:rgba(0,0,0,.35);border:1px solid var(--edge);
  border-radius:1px;color:var(--chalk);padding:9px;font-family:'IBM Plex Mono',monospace;font-size:12px}

.live{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid rgba(27,92,70,.7);
  border-radius:1px;padding:4px 8px;cursor:pointer;color:var(--mute);
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.live:hover{border-color:var(--brass);color:var(--chalk)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--brass);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.foot{display:flex;align-items:center;gap:10px;margin-top:26px;padding-top:12px;
  border-top:1px solid rgba(27,92,70,.4);font-family:'IBM Plex Mono',monospace;
  font-size:10px;letter-spacing:.08em;color:var(--mute)}
#saved{opacity:0;color:var(--brass);transition:opacity .3s;text-transform:uppercase;letter-spacing:.2em}
#saved.on{opacity:1}

@media(max-width:420px){
  .pts-grid{grid-template-columns:repeat(3,1fr)}
  .plate{min-width:26px;height:36px;font-size:19px}
  .side{font-size:12px;padding:11px 6px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">
      <span>20 players</span><span class="dot"></span>
      <span>5 teams of 4</span><span class="dot"></span>
      <span id="eventCount">4 events</span>
    </div>
    <input id="title" aria-label="Tournament name">
    <div class="brass-rule"></div>
  </header>

  <div class="share-row">
    <button class="solid" id="share">Copy share link</button>
    <button class="help-btn" id="helpBtn">How to use</button>
    <button class="help-btn" id="switchBtn">Switch board</button>
    <span class="code" id="boardCode"></span>
    <span class="share-msg" id="shareMsg"></span>
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab on" data-tab="board" role="tab">Board</button>
    <button class="tab" data-tab="golf" role="tab">Golf</button>
    <button class="tab" data-tab="games" role="tab">Games</button>
    <button class="tab" data-tab="teams" role="tab">Teams</button>
  </nav>

  <main id="main"><div class="note">Setting the board…</div></main>

  <footer class="foot">
    <span id="saved">Saved</span>
    <button class="live" id="live" title="Check for updates now">
      <i></i><span id="liveTime">live</span>
    </button>
    <span id="footNote">Everyone with the link sees and edits the same board.</span>
  </footer>
</div>

<script>
/* ---------------- state ---------------- */
const IDS = ["t1","t2","t3","t4","t5"];

const MATCHUPS = (() => {
  const o = [];
  for (let i=0;i<IDS.length;i++) for (let j=i+1;j<IDS.length;j++) o.push({key:IDS[i]+"|"+IDS[j], a:IDS[i], b:IDS[j]});
  return o;
})();

/* Circle method: 5 rounds of 2 matches, every team sits out exactly once
   and all 10 matchups happen exactly once. */
const ROUNDS = (() => {
  const BYE = 5;
  let arr = [0,1,2,3,4,BYE];
  const rounds = [];
  for (let r = 0; r < 5; r++){
    const matches = []; let bye = null;
    for (let i = 0; i < 3; i++){
      const a = arr[i], b = arr[5-i];
      if (a === BYE) bye = b;
      else if (b === BYE) bye = a;
      else {
        const lo = Math.min(a,b), hi = Math.max(a,b);
        matches.push({key: IDS[lo]+"|"+IDS[hi], a: IDS[lo], b: IDS[hi]});
      }
    }
    rounds.push({n: r+1, matches, bye: IDS[bye]});
    arr = [arr[0], arr[5], ...arr.slice(1,5)];
  }
  return rounds;
})();

/* Balanced designs for 5 teams. One match per round. Every team plays the
   same number of matches and meets every other team at least once.
     2 per match -> 10 matches, each team plays 4, every pair exactly once
     3 per match ->  5 matches, each team plays 3, every pair at least once
     4 per match ->  5 matches, each team plays 4, every pair at least once
     5 per match ->  1 match,   everyone plays everyone                     */
function baseBlocks(k){
  const I = [0,1,2,3,4];
  if (k >= 5) return [[0,1,2,3,4]];
  if (k === 4) return I.map(out => I.filter(x => x !== out));
  if (k === 3) return I.map(i => [i, (i+1)%5, (i+2)%5]);
  /* k === 2: full round robin, ordered by the circle method so no team plays
     twice in a row where it can be avoided. */
  const out = [];
  ROUNDS.forEach(r => r.matches.forEach(m => out.push([IDS.indexOf(m.a), IDS.indexOf(m.b)])));
  return out;
}

function scheduleFor(game){
  const k = Math.min(5, Math.max(2, game.teams || 5));
  const cycles = Math.min(4, Math.max(1, game.cycles || 1));
  const base = baseBlocks(k);
  const out = [];
  let n = 1;
  for (let c = 0; c < cycles; c++){
    base.forEach((block, bi) => {
      const teams = block.map(i => IDS[i]);
      out.push({
        n: n++,
        matches: [{key: "c" + c + "m" + bi, teams}],
        byes: IDS.filter(id => teams.indexOf(id) < 0)
      });
    });
  }
  return out;
}

/* Matches each team is scheduled for — identical for every team by design. */
function matchesEach(game){
  const sched = scheduleFor(game);
  let n = 0;
  sched.forEach(r => r.matches.forEach(m => { if (m.teams.indexOf(IDS[0]) > -1) n++; }));
  return n;
}

function playedCount(game){
  const res = game.results || {};
  let n = 0;
  scheduleFor(game).forEach(r => r.matches.forEach(m => { if (res[m.key]) n++; }));
  return n;
}

function pending(game, teamId){
  const res = game.results || {};
  const out = [];
  scheduleFor(game).forEach(r => r.matches.forEach(m => {
    if (m.teams.indexOf(teamId) > -1 && !res[m.key]) out.push({round: r.n, teams: m.teams});
  }));
  return out;
}

/* Rank teams and hand out the points ladder. Ties split the places they take
   up — so most wins earns the top points however many wins that was. */
function placePoints(vals, pts, higherBetter){
  const out = {}; IDS.forEach(id => out[id] = 0);
  const arr = IDS.map(id => ({id, v: vals[id] || 0}));
  arr.sort((a,b) => higherBetter ? b.v - a.v : a.v - b.v);
  let slot = 0, i = 0;
  while (i < arr.length){
    let j = i;
    while (j+1 < arr.length && arr[j+1].v === arr[i].v) j++;
    const n = j - i + 1;
    let sum = 0;
    for (let q = 0; q < n; q++) sum += (pts[slot+q] != null ? pts[slot+q] : 0);
    for (let q = i; q <= j; q++) out[arr[q].id] = sum / n;
    slot += n; i = j + 1;
  }
  return out;
}


/* ---------------- bracket engine ----------------
   Each team splits into two pairs, A and B. All the A pairs go in the top
   half, all the B pairs in the bottom half, so a team's own two pairs can
   only ever meet in the grand final.

   Refs: {s:"t1A"} a seeded pair, {w:"KEY"} the winner of a match,
         {l:"KEY"} the loser of a match.                                */

function pairId(ti, half){ return "t" + (ti+1) + half; }
function pairTeamId(pid){ return pid.slice(0, -1); }
function pairHalf(pid){ return pid.slice(-1); }
function pairLabel(pid){
  const t = S.teams.find(x => x.id === pairTeamId(pid));
  return (t ? t.name : pairTeamId(pid)) + " " + pairHalf(pid);
}
function pairPlayers(pid){
  const t = S.teams.find(x => x.id === pairTeamId(pid));
  if (!t) return "";
  const p = pairHalf(pid) === "A" ? [t.players[0], t.players[1]] : [t.players[2], t.players[3]];
  return p.filter(Boolean).join(" & ");
}

function halfMatches(h, mode){
  const s = i => ({s: pairId(i, h)});
  const k = n => h + "-" + n;
  const wb = [
    {key:k("P"),  group:"Play-in",   label:"Play-in",       a:s(3),           b:s(4)},
    {key:k("S1"), group:"Quarters",  label:"Quarter-final", a:s(0),           b:{w:k("P")}},
    {key:k("S2"), group:"Quarters",  label:"Quarter-final", a:s(1),           b:s(2)},
    {key:k("WF"), group:"Half final",label:"Half final",    a:{w:k("S1")},    b:{w:k("S2")}}
  ];
  if (mode === "se") return wb;
  return wb.concat([
    {key:k("L1"), group:"Second chance", label:"Second chance", a:{l:k("S1")}, b:{l:k("S2")}},
    {key:k("L2"), group:"Second chance", label:"Second chance", a:{w:k("L1")}, b:{l:k("P")}},
    {key:k("L3"), group:"Second chance", label:"Second chance", a:{w:k("L2")}, b:{l:k("WF")}},
    {key:k("HF"), group:"Half decider",  label:"Half decider",  a:{w:k("WF")}, b:{w:k("L3")}}
  ]);
}

function bracketDef(game){
  const mode = game.mode === "de" ? "de" : "se";
  const matches = halfMatches("A", mode).concat(halfMatches("B", mode));
  const topA = mode === "se" ? "A-WF" : "A-HF";
  const topB = mode === "se" ? "B-WF" : "B-HF";
  matches.push({key:"F", group:"Grand final", label:"Grand final", a:{w:topA}, b:{w:topB}});
  return {mode, matches, topA, topB};
}

function resolveRef(ref, res, matches){
  if (ref.s) return ref.s;
  const key = ref.w || ref.l;
  const m = matches.find(x => x.key === key);
  if (!m) return null;
  const win = res[key];
  if (!win) return null;
  if (ref.w) return win;
  const a = resolveRef(m.a, res, matches);
  const b = resolveRef(m.b, res, matches);
  if (!a || !b) return null;
  return win === a ? b : a;
}

/* Places 1-10. Pairs knocked out in the same round share the places they
   take up, so two teams that go out together score identically. */
function bracketPlaces(game){
  const {mode, matches} = bracketDef(game);
  const res = game.results || {};
  const P = {};
  const put = (pid, v) => { if (pid) P[pid] = v; };
  const W = k => resolveRef({w:k}, res, matches);
  const L = k => resolveRef({l:k}, res, matches);

  put(W("F"), 1);
  put(L("F"), 2);
  if (mode === "se"){
    ["A-WF","B-WF"].forEach(k => put(L(k), 3.5));
    ["A-S1","A-S2","B-S1","B-S2"].forEach(k => put(L(k), 6.5));
    ["A-P","B-P"].forEach(k => put(L(k), 9.5));
  } else {
    ["A-HF","B-HF"].forEach(k => put(L(k), 3.5));
    ["A-L3","B-L3"].forEach(k => put(L(k), 5.5));
    ["A-L2","B-L2"].forEach(k => put(L(k), 7.5));
    ["A-L1","B-L1"].forEach(k => put(L(k), 9.5));
  }
  return P;
}

function bracketDone(game){
  return !!(game.results || {})["F"];
}

/* Team score = its two pairs' places added together. Lower is better, so
   1st + 2nd (3) beats 1st + last (10.5). */
function bracketTeamScores(game){
  const P = bracketPlaces(game);
  const out = {};
  IDS.forEach((id, i) => {
    out[id] = (P[pairId(i,"A")] || 0) + (P[pairId(i,"B")] || 0);
  });
  return out;
}

function isBracket(game){ return game.mode === "se" || game.mode === "de"; }

/* Points a game contributes, whatever its format. */
function gamePointsFor(game){
  if (isBracket(game)){
    if (!bracketDone(game)) return {};
    return placePoints(bracketTeamScores(game), game.pts, false);
  }
  return playedCount(game) > 0 ? placePoints(winsOf(game), game.pts, true) : {};
}

/* ---------------- scoring ---------------- */
function golfPts(){
  const p = {}; IDS.forEach(id => p[id]=0);
  const scored = S.teams
    .map(t => ({id:t.id, score: parseFloat(S.golfScores[t.id])}))
    .filter(t => !isNaN(t.score))
    .sort((a,b) => a.score - b.score);
  let slot = 0, i = 0;
  while (i < scored.length){
    let j = i;
    while (j+1 < scored.length && scored[j+1].score === scored[i].score) j++;
    const n = j-i+1;
    let sum = 0;
    for (let k=0;k<n;k++) sum += (S.golfPoints[slot+k] ?? 0);
    for (let k=i;k<=j;k++) p[scored[k].id] = sum/n;
    slot += n; i = j+1;
  }
  return p;
}
function winsOf(game){
  const w = {}; IDS.forEach(id => w[id]=0);
  Object.values(game.results||{}).forEach(x => { if (w[x] !== undefined) w[x]++; });
  return w;
}
function standings(){
  const g = golfPts();
  const per = liveGames().map(x => ({game:x, wins:winsOf(x), pts:gamePointsFor(x)}));
  const rows = S.teams.map(t => {
    const gw = per.map(p => ({id:p.game.id, name:p.game.name, wins:isBracket(p.game) ? null : p.wins[t.id], pts:(p.pts[t.id] || 0)}));
    const wt = gw.reduce((s,x) => s+x.pts, 0);
    const raw = parseFloat(S.golfScores[t.id]);
    return {team:t, golf:g[t.id], score:isNaN(raw)?null:raw, gw, wt, total:g[t.id]+wt};
  });
  rows.sort((a,b) => b.total-a.total || b.golf-a.golf || a.team.name.localeCompare(b.team.name));
  let pos = 0;
  rows.forEach((r,i) => {
    if (i===0 || r.total !== rows[i-1].total) pos = i+1;
    r.pos = pos;
    r.tied = rows.some((o,k) => k!==i && o.total===r.total);
  });
  return rows;
}
const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- storage ----------------
   No setup required. The first time this page opens it creates a shared

function endpoint(){

/* Remote stores can drop empty objects and nulls, so rebuild anything missing. */
/* Firebase forbids . $ # [ ] and / in key names, and every field-tracking key
   uses dots. Swap them for ~ on the way out, back on the way in. */
const BAD_KEY = /[.$#\[\]\/]/;
function encodeV(V){
  const o = {};
  for (const k in V) o[k.replace(/\./g, "~")] = V[k];
  return o;
}
function decodeV(V){
  const o = {};
  for (const k in V) o[k.replace(/~/g, ".")] = V[k];
  return o;
}

/* Belt and braces: catch any key the database would reject before sending. */
function badKeys(obj, path, out){
  out = out || []; path = path || "";
  if (!obj || typeof obj !== "object") return out;
  if (Array.isArray(obj)){ obj.forEach((v,i) => badKeys(v, path+"["+i+"]", out)); return out; }
  for (const k in obj){
    if (BAD_KEY.test(k)) out.push(path + "/" + k);
    badKeys(obj[k], path + "/" + k, out);
  }
  return out;
}

function toArr(v){
  if (Array.isArray(v)) return v;
  if (v && typeof v === "object"){
    return Object.keys(v).sort((a,b) => Number(a)-Number(b)).map(k => v[k]);
  }
  return null;
}

function normalize(x){
  if (!x || typeof x !== "object") return null;
  const b = blank();
  const out = {
    title: typeof x.title === "string" ? x.title : b.title,
    pool: typeof x.pool === "string" ? x.pool : "",
    golfRules: typeof x.golfRules === "string" ? x.golfRules : "",
    golfPoints: toArr(x.golfPoints) ? toArr(x.golfPoints).map(n => Number(n)||0) : b.golfPoints,
    golfScores: Object.assign({t1:"",t2:"",t3:"",t4:"",t5:""}, x.golfScores || {}),
    teams: IDS.map((id,i) => {
      const t = (toArr(x.teams) || [])[i] || {};
      const p = toArr(t.players) ? toArr(t.players).slice() : [];
      while (p.length < 4) p.push("");
      return {id, name: t.name || ("Team "+(i+1)), players: p.map(v => v == null ? "" : String(v))};
    }),
    games: (toArr(x.games) || b.games).map((g,i) => ({
      id: g.id || ("g"+(i+1)),
      name: g.name || ("Game "+(i+1)),
      del: !!g.del,
      teams: Math.min(5, Math.max(2, Number(g.teams) || 5)),
      cycles: Math.min(4, Math.max(1, Number(g.cycles) || 1)),
      pts: toArr(g.pts) ? toArr(g.pts).map(n => Number(n)||0) : [4,3,2,1,0],
      rules: typeof g.rules === "string" ? g.rules : "",
      mode: (g.mode === "se" || g.mode === "de") ? g.mode : "rr",
      results: g.results || {}
    })),
    V: (x.V && typeof x.V === "object") ? decodeV(x.V) : {}
  };
  if (!out.games.length) out.games = b.games;
  return out;
}

/* ---------------- merge ----------------
   Field-level last-writer-wins. Anything the other device changed more
   recently than this one wins that field; everything else is kept. */
function merge(local, remote){
  if (!remote) return {state: local, changed: false};
  const lv = local.V || {}, rv = remote.V || {};
  const V = Object.assign({}, lv);
  let changed = false;
  const take = (f, apply) => {
    if ((rv[f] || 0) > (V[f] || 0)){ apply(); V[f] = rv[f]; changed = true; }
  };

  take("title", () => local.title = remote.title);
  take("pool",  () => local.pool  = remote.pool);
  take("golfRules", () => local.golfRules = remote.golfRules || "");
  for (let i = 0; i < 5; i++) take("gp."+i, () => local.golfPoints[i] = remote.golfPoints[i]);
  IDS.forEach(id => take("golf."+id, () => local.golfScores[id] = remote.golfScores[id]));

  local.teams.forEach((t,i) => {
    const rt = (toArr(remote.teams) || [])[i] || {};
    take("t."+i+".name", () => t.name = rt.name || t.name);
    const n = Math.max(t.players.length, (rt.players||[]).length, 4);
    for (let j = 0; j < n; j++){
      take("t."+i+".p."+j, () => {
        while (t.players.length <= j) t.players.push("");
        t.players[j] = rp[j] || "";
      });
    }
  });

  const byId = {};
  local.games.forEach(g => byId[g.id] = g);
  (toArr(remote.games) || []).forEach(rg => {
    let g = byId[rg.id];
    if (!g){
      g = {id: rg.id, name: rg.name, del: !!rg.del, results: {}};
      local.games.push(g); byId[rg.id] = g;
      V["g."+rg.id+".name"] = rv["g."+rg.id+".name"] || 0;
      V["g."+rg.id+".del"]  = rv["g."+rg.id+".del"]  || 0;
      changed = true;
    }
    take("g."+rg.id+".name", () => g.name = rg.name);
    take("g."+rg.id+".del",  () => g.del  = !!rg.del);
    take("g."+rg.id+".fmt",  () => { g.teams = rg.teams; g.cycles = rg.cycles; g.mode = rg.mode || "rr"; });
    take("g."+rg.id+".pts",  () => g.pts = (toArr(rg.pts) || [4,3,2,1,0]).slice());
    take("g."+rg.id+".rules",() => g.rules = rg.rules || "");
    take("g."+rg.id+".wipe", () => g.results = {});
    const keys = new Set(Object.keys(g.results||{}).concat(Object.keys(rg.results||{})));
    keys.forEach(k => take("g."+rg.id+".r."+k, () => {
      const w = (rg.results || {})[k];
      if (w) g.results[k] = w; else delete g.results[k];
    }));
  });

  local.V = V;
  return {state: local, changed};
}

/* Does this device hold anything the server hasn't seen? */
function aheadOf(remote){
  const lv = S.V || {}, rv = (remote && remote.V) || {};
  for (const f in lv) if ((lv[f] || 0) > (rv[f] || 0)) return true;
  return false;
}

async function pull(){
  const url = endpoint();
  try {
    if (!url){
      const raw = localStorage.getItem(KEY);
      return raw ? normalize(JSON.parse(raw)) : null;
    }
    const r = await fetch(url + (DB_URL ? "?t=" + Date.now() : ""), {
      cache: "no-store",
      headers: {"Accept":"application/json"}
    });
    if (!r.ok) throw new Error(r.status);
    return normalize(await r.json());
  } catch(e){ return null; }
}

async function push(state){
  const url = endpoint();
  if (!url){
    localStorage.setItem(KEY, JSON.stringify(state));
    return;
  }
  const payload = DB_URL
    ? Object.assign({}, state, {V: encodeV(state.V || {})})
    : state;
  if (DB_URL){
    const bad = badKeys(payload);
    if (bad.length){
      const err = new Error("Invalid field name: " + bad[0]);
      err.badKey = true;
      throw err;
    }
  }
  const r = await fetch(url, {
    method: "PUT",
    headers: {"Content-Type":"application/json","Accept":"application/json"},
    body: JSON.stringify(payload)
  });
  if (!r.ok){
    let body = "";
    try { body = await r.text(); } catch(e){}
    const err = new Error("HTTP " + r.status);
    err.status = r.status;
    err.denied = r.status === 401 || r.status === 403 || /permission denied/i.test(body);
    throw err;
  }
}

/* Plain-language check of whether the database will accept writes. */
async function dbCheck(){
  if (!DB_URL) return {ok:true};
  try {
    const r = await fetch(DB_URL.replace(/\/+$/,"") + "/boards/connection-test.json", {
      method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({checkedAt: Date.now()})
    });
    if (r.ok) return {ok:true};
    let body = ""; try { body = await r.text(); } catch(e){}
    if (r.status === 401 || r.status === 403 || /permission denied/i.test(body))
      return {ok:false, why:"The database is refusing writes. In Firebase open Realtime Database \u2192 Rules and publish the rule from the README."};
    if (r.status === 404)
      return {ok:false, why:"That database URL doesn't exist. Check it in the Firebase console."};
    return {ok:false, why:"The database replied with an error (" + r.status + ")."};
  } catch(e){
    return {ok:false, why:"Couldn't reach the database at all \u2014 check your connection."};
  }
}

/* Creates a new shared board and returns its ID. */
async function createBoard(state){
  const r = await fetch(STORE, {
    method: "POST",
    headers: {"Content-Type":"application/json","Accept":"application/json"},
    body: JSON.stringify(state)
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const loc = r.headers.get("Location") || r.headers.get("location") || "";
  const id = loc.split("/").filter(Boolean).pop();
  if (!id) throw new Error("no board id returned");
  return id;
}

let dirty = false, flushing = false, netOk = true, needsRender = false;

function saveLocal(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
}

function typing(){
  const t = document.activeElement && document.activeElement.tagName;
  return t === "INPUT" || t === "TEXTAREA";
}

/* Every edit names the exact fields it changed and stamps them. */
function touch(){
  const now = Date.now();
  for (let i = 0; i < arguments.length; i++) S.V[arguments[i]] = now;
  lastEdit = now;
  dirty = true;
  saveLocal();
  setStatus();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 400);
}

/* Read, merge, write — so a save can never clobber someone else's entry. */
async function flush(){
  if (!SHARED || gated || flushing) return;
  flushing = true;
  try {
    const remote = await pull();
    if (remote){
      const res = merge(S, remote);
      S = res.state;
      if (res.changed){ if (typing()) needsRender = true; else render(); }
    }
    await push(S);
    dirty = false; netOk = true;
    saveLocal();
    noteRecent(boardId, S.title);
    const el = document.getElementById("saved");
    if (el){ el.classList.add("on"); setTimeout(()=>el.classList.remove("on"), 1200); }
  } catch(e){
    netOk = false;              // stays dirty; the retry loop keeps trying
  } finally {
    flushing = false;
    setStatus();
  }
}

function setStatus(){
  const note = document.getElementById("footNote");
  if (!note) return;
  if (!SHARED){ note.textContent = "Saved on this device only."; return; }
  if (!netOk)  { note.textContent = "Offline — your entries are saved and will sync when signal returns."; return; }
  if (dirty)   { note.textContent = "Syncing…"; return; }
  note.textContent = "Everyone with this link sees and edits the same board.";
}

let gated = false;

function cachedState(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const n = normalize(JSON.parse(raw));
    if (!n) return null;
    const hasWork = n.teams.some(t => t.players.some(Boolean))
      || Object.values(n.golfScores).some(v => v !== "")
      || n.games.some(g => Object.keys(g.results||{}).length);
    return hasWork ? n : null;
  } catch(e){ return null; }
}

function wireGate(){
  const msg = t => { const el = document.getElementById("gateMsg"); if (el) el.textContent = t; };

  document.getElementById("joinBtn").onclick = async () => {
    const raw = document.getElementById("joinCode").value.trim();
    let id;
    if (BYWORD){
      id = cleanWord(raw);
      if (!id){ msg("Type the keyword your captain gave you."); return; }
    } else {
      const m = raw.match(/board=([A-Za-z0-9_-]+)/);
      id = m ? m[1] : raw.replace(/^.*\//, "");
      if (!id){ msg("Paste the link or the code from it."); return; }
    }
    msg("Looking…");
    boardId = id;
    const remote = await pull();
    if (!remote){
      boardId = "";
      msg(BYWORD ? "No board called \u201c" + id + "\u201d yet. Check the spelling with your captain."
                 : "No board found with that code. Check the link.");
      return;
    }
    S = remote;
    setBoardId(id);
    SHARED = true; gated = false;
    activeGame = (liveGames()[0]||{}).id || "g1";
    render();
  };

  document.querySelectorAll(".js-rec").forEach(el => el.onclick = async () => {
    msg("Opening \u201c" + el.dataset.w + "\u201d\u2026");
    boardId = el.dataset.w;
    const remote = await pull();
    if (!remote){ boardId = ""; msg("Couldn't open that one. Check your connection."); return; }
    S = remote;
    setBoardId(el.dataset.w);
    SHARED = true; gated = false;
    activeGame = (liveGames()[0]||{}).id || "g1";
    render();
  });
  document.querySelectorAll(".js-recx").forEach(el => el.onclick = e => {
    e.stopPropagation();
    forgetRecent(el.dataset.w);
    render();
  });

  const nmsg = t => {
    const el = document.getElementById("newMsg") || document.getElementById("gateMsg");
    if (el) el.textContent = t;
  };

  const start = async (useCache) => {
    const c = useCache ? cachedState() : null;
    if (c) S = c; else S = blank();
    try {
      if (BYWORD){
        const raw = document.getElementById("newWord").value;
        const word = cleanWord(raw);
        if (!word){
          nmsg(raw.trim() ? "Use letters, numbers and dashes only." : "Type a keyword first.");
          return;
        }
        nmsg("Creating \u201c" + word + "\u201d\u2026");
        boardId = word;
        const exists = await pull();
        if (exists){
          nmsg("\u201c" + word + "\u201d already exists. Type it in the box above to open it, or pick another word.");
          boardId = "";
          return;
        }
        await push(S);
        setBoardId(word);
      } else {
        setBoardId(await createBoard(S));
      }
      SHARED = true; gated = false;
      activeGame = (liveGames()[0]||{}).id || "g1";
      render();
      shareMsg(BYWORD ? "Board \u201c" + boardId + "\u201d is live. Send that word to your captains." : "New board created — copy the link for the group.");
    } catch(e){
      boardId = "";
      nmsg(e && e.denied
        ? "The database is refusing writes. In Firebase open Realtime Database \u2192 Rules and publish the rule from the README."
        : e && e.badKey
          ? "The board contains a field name the database won't accept (" + e.message + ")."
          : "Couldn't save the new board (" + ((e && e.message) || "network error") + "). Tap Test connection.");
    }
  };

  const tb = document.getElementById("testBtn");
  if (tb) tb.onclick = async () => {
    nmsg("Checking\u2026");
    const r = await dbCheck();
    nmsg(r.ok ? "Database is connected and accepting writes. You're good to create a board." : r.why);
  };
  document.getElementById("newBtn").onclick = () => start(true);
  const ne = document.getElementById("newEmptyBtn");
  if (ne) ne.onclick = () => start(false);
}

function bracketBody(game){
  const {mode, matches} = bracketDef(game);
  const res = game.results || {};
  const done = bracketDone(game);

  const row = m => {
    const a = resolveRef(m.a, res, matches);
    const b = resolveRef(m.b, res, matches);
    const win = res[m.key];
    const ready = a && b;
    const cell = (pid, other) => pid
      ? `<button class="side js-win ${win===pid?"win":""} ${win&&win!==pid?"lose":""}"
                 data-k="${m.key}" data-t="${pid}">${esc(pairLabel(pid))}</button>`
      : `<span class="side tbd">TBD</span>`;
    return `<div class="brmatch ${ready?"":"pend"}">
      <div class="brlabel">${m.label}</div>
      <div class="lineup">${cell(a)}${cell(b)}</div>
    </div>`;
  };

  const section = (title, keys) => {
    const ms = keys.map(k => matches.find(x => x.key === k)).filter(Boolean);
    if (!ms.length) return "";
    return `<div class="brsec"><h4 class="brsec-h">${title}</h4>${ms.map(row).join("")}</div>`;
  };

  const half = (h, name) => mode === "se"
    ? section(name, [h+"-P", h+"-S1", h+"-S2", h+"-WF"])
    : section(name + " &middot; main", [h+"-P", h+"-S1", h+"-S2", h+"-WF"]) +
      section(name + " &middot; second chance", [h+"-L1", h+"-L2", h+"-L3"]) +
      section(name + " &middot; decider", [h+"-HF"]);

  return `
    <div class="panel">
      <p class="panel-sub">${done
        ? "Bracket complete. Points are on the Board."
        : "Tap the winner of each match. Later matches fill in as earlier ones finish."}</p>
      ${half("A", "Top half")}
      ${half("B", "Bottom half")}
      ${section("Grand final", ["F"])}
    </div>

    <div class="panel">
      <h3 class="panel-h">The ten pairs</h3>
      <p class="panel-sub">Every team splits in two. A pairs are in the top half, B pairs in the bottom, so your own two pairs can only meet in the grand final. Pairs come from the player order on the Teams tab.</p>
      ${IDS.map((id,i) => ["A","B"].map(h => {
        const pid = pairId(i,h);
        const players = pairPlayers(pid);
        return `<div class="pair-row">
          <span class="pair-name">${esc(pairLabel(pid))}</span>
          <span class="pair-players">${players ? esc(players) : "no names yet"}</span>
        </div>`;
      }).join("")).join("")}
    </div>`;
}

function games(){

  const per = matchesEach(game);

  const rounds = sched.map(r => ({...r, done: r.matches.every(m => res[m.key])}));
  const upNext = rounds.findIndex(r => !r.done);

          ${[["rr","Rounds"],["se","Single"],["de","Double"]].map(([m,l]) =>

        : sched.length + " " + (sched.length === 1 ? "match" : "matches") + " total &middot; every team plays " +

    </div>

    <div class="panel">
      <h3 class="panel-h">Points for this game</h3>
      <p class="panel-sub">${bracket ? "Awarded on the two pairs\u0027 finishing places added together \u2014 lowest total takes the top points." : "Awarded on total wins, not per win."}${bracket ? "" : "  Whoever wins the most takes the top points, however many wins that was."} Teams level split the places they take up.</p>
      <div class="pts-grid">
        ${game.pts.map((v,i) => `
          <label class="pts-cell"><span>${labels[i]}</span>
            <input class="js-gpts" data-i="${i}" inputmode="decimal" value="${v}" aria-label="Points for ${labels[i]}">
          </label>`).join("")}
      </div>
    </div>

    ${bracket ? bracketStanding(game) : `
    <div class="panel">
      <h3 class="panel-h">Standing in ${esc(game.name)}</h3>
      <p class="panel-sub">${left === 0 ? "Final." : left + (left === 1 ? " match" : " matches") + " still to play."}</p>
      ${S.teams.map(t => {
        const owed = pending(game, t.id);
        return `<div class="gstand">
          <div class="gstand-top">
            <span class="wins-name">${esc(t.name)}</span>
            ${tally(w[t.id])}
            <span class="wins-num">${w[t.id]}W</span>
            <span class="gstand-pts">${started ? fmt(pp[t.id]) : "\u2013"}</span>
          </div>
          <div class="owed-list ${owed.length ? "" : "clear"}">${
            owed.length
              ? "Still to play: " + esc(owed.map(x => game.teams === 2
                  ? teamName(x.teams.find(id => id !== t.id))
                  : "match " + x.round).join(", "))
              : "All matches played"
          }</div>
        </div>`;
      }).join("")}
    </div>`}

    <div class="panel">
      <h3 class="panel-h">Add a game</h3>
      <p class="panel-sub">New games start as one match with all five teams. Change the format after adding it.</p>
      <div class="add-row">
        <input class="text-input" id="newGame" placeholder="Cornhole, ladder golf, dizzy bat\u2026">
        <button class="solid" id="addGame">Add</button>
      </div>
    </div>
  </div>`;
}

function poolNames(){
  return (S.pool||"").split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
}

function teams(){
  const n = poolNames().length;
  return `<div class="stack">
    <div class="panel">
      <h3 class="panel-h">Player pool</h3>
      <p class="panel-sub">Paste all 20 names, one per line or separated by commas. Drawing shuffles them and deals four to a team.</p>
      <textarea class="pool-area" id="pool" placeholder="Thomas&#10;Julian&#10;…" aria-label="Player pool">${esc(S.pool||"")}</textarea>
      <div class="pool-bar">
        <span class="count ${n===20?"full":""}" id="poolCount">${n} ${n===1?"name":"names"}${n===20?" — full field":""}</span>
        <button class="ghost" id="pullNames">Pull from teams</button>
        <button class="solid" id="draw">Draw teams</button>
        <div class="pool-msg" id="poolMsg"></div>
      </div>
    </div>
    ${S.teams.map((t,ti) => `
      <div class="panel">
        <input class="team-name js-tname" data-i="${ti}" value="${esc(t.name)}" aria-label="Team ${ti+1} name">
        <div class="roster">
          ${t.players.map((p,pi) => `
            <input class="player-input js-player" data-t="${ti}" data-p="${pi}" placeholder="Player ${pi+1}" value="${esc(p)}" aria-label="${esc(t.name)} player ${pi+1}">`).join("")}
        </div>
      </div>`).join("")}
    <div class="panel">
      <h3 class="panel-h">Start over</h3>
      <p class="panel-sub">Clears every name, score and result for everyone.</p>
      <button class="ghost danger" id="reset">Reset tournament</button>
    </div>
  </div>`;
}

/* ---------------- events ---------------- */
function arm(btn, label, action){
  if (btn.dataset.armed === "1"){
    btn.dataset.armed = "";
    action();
    return;
  }
  const orig = btn.textContent;
  btn.dataset.armed = "1";
  btn.textContent = label;
  btn.classList.add("armed");
  setTimeout(() => {
    if (btn.dataset.armed === "1"){
      btn.dataset.armed = "";
      btn.textContent = orig;
      btn.classList.remove("armed");
    }
  }, 4000);
}
function poolMsg(text){
  const el = document.getElementById("poolMsg");
  if (el) el.textContent = text;
}

function wire(){
  const gre = document.querySelector(".js-goredit");
  if (gre) gre.onclick = () => { editGolfRules = !editGolfRules; render(); };
  const gra = document.querySelector(".js-gorules");
  if (gra){
    gra.oninput = e => { S.golfRules = e.target.value; touch("golfRules"); };
    gra.focus();
    gra.setSelectionRange(gra.value.length, gra.value.length);
  }

  document.querySelectorAll(".js-score").forEach(el => el.oninput = e => {
    const v = e.target.value.replace(/[^0-9.]/g,"");
    if (v !== e.target.value) e.target.value = v;
    S.golfScores[e.target.dataset.id] = v;
    const fld = "golf." + e.target.dataset.id;
    const g = golfPts();
    document.querySelectorAll("[data-pts]").forEach(s => s.textContent = fmt(g[s.dataset.pts]) + " pts");
    touch(fld);
  });
  document.querySelectorAll(".js-gp").forEach(el => el.oninput = e => {
    S.golfPoints[+e.target.dataset.i] = parseFloat(e.target.value) || 0;
    const fld = "gp." + e.target.dataset.i;
    const g = golfPts();
    document.querySelectorAll("[data-pts]").forEach(s => s.textContent = fmt(g[s.dataset.pts]) + " pts");
    touch(fld);
  });
  document.querySelectorAll(".js-gtab").forEach(el => el.onclick = () => { activeGame = el.dataset.id; editRules = false; render(); });
  document.querySelectorAll(".js-win").forEach(el => el.onclick = () => {
    const g = S.games.find(x => x.id === activeGame);
    if (g.results[el.dataset.k] === el.dataset.t) delete g.results[el.dataset.k];
    else g.results[el.dataset.k] = el.dataset.t;
    touch("g." + activeGame + ".r." + el.dataset.k); render();
  });
  const g0 = () => S.games.find(x => x.id === activeGame);
  document.querySelectorAll(".js-fteams").forEach(el => el.onclick = () => {
    const g = g0(); const n = +el.dataset.n;
    if (g.teams === n) return;
    g.teams = n; g.results = {};                 // schedule changed, results no longer map
    touch("g."+g.id+".fmt", "g."+g.id+".wipe"); render();
  });
  document.querySelectorAll(".js-fmode").forEach(el => el.onclick = () => {
    const g = g0(); const m = el.dataset.m;
    if ((g.mode || "rr") === m) return;
    g.mode = m; g.results = {};
    touch("g."+g.id+".fmt", "g."+g.id+".wipe"); render();
  });
  document.querySelectorAll(".js-fcyc").forEach(el => el.onclick = () => {
    const g = g0(); const n = +el.dataset.n;
    if (g.cycles === n) return;
    g.cycles = n;
    touch("g."+g.id+".fmt"); render();
  });
  document.querySelectorAll(".js-gpts").forEach(el => el.oninput = e => {
    const g = g0();
    g.pts[+e.target.dataset.i] = parseFloat(e.target.value) || 0;
    touch("g."+g.id+".pts");
  });

  const re = document.querySelector(".js-redit");
  if (re) re.onclick = () => { editRules = !editRules; render(); };
  const ra = document.querySelector(".js-rules");
  if (ra){
    ra.oninput = e => { g0().rules = e.target.value; touch("g."+activeGame+".rules"); };
    ra.focus();
    ra.setSelectionRange(ra.value.length, ra.value.length);
  }

  const gn = document.querySelector(".js-gname");
  if (gn) gn.oninput = e => {
    S.games.find(x => x.id === activeGame).name = e.target.value;
    const chip = document.querySelector('.js-gtab[data-id="'+activeGame+'"]');
    if (chip) chip.textContent = e.target.value;
    const h = document.querySelector(".wins-h");
    if (h) h.textContent = e.target.value + " wins";
    touch("g." + activeGame + ".name");
  };
  const rm = document.querySelector(".js-grm");
  if (rm) rm.onclick = () => arm(rm, "Delete?", () => {
    const dead = activeGame;
    const g = S.games.find(x => x.id === dead);
    if (g) g.del = true;
    if (!liveGames().length){
      const nid = "g" + Date.now();
      S.games.push({id:nid, name:"New game", del:false, results:{}});
      touch("g." + nid + ".del", "g." + nid + ".name");
    }
    activeGame = liveGames()[0].id;
    touch("g." + dead + ".del"); render();
  });
  const add = document.getElementById("addGame");
  if (add) add.onclick = () => {
    const inp = document.getElementById("newGame");
    const name = inp.value.trim(); if (!name) { inp.focus(); return; }
    const id = "g" + Date.now();
    S.games.push({id, name, mode:"rr", del:false, teams:5, cycles:1, pts:[4,3,2,1,0], rules:"", results:{}});
    activeGame = id; touch("g." + id + ".del", "g." + id + ".name"); render();
  };
  const ng = document.getElementById("newGame");
  if (ng) ng.onkeydown = e => { if (e.key === "Enter") document.getElementById("addGame").click(); };
  document.querySelectorAll(".js-tname").forEach(el => el.oninput = e => {
    S.teams[+e.target.dataset.i].name = e.target.value;
    touch("t." + e.target.dataset.i + ".name");
  });
  document.querySelectorAll(".js-player").forEach(el => el.oninput = e => {
    S.teams[+e.target.dataset.t].players[+e.target.dataset.p] = e.target.value;
    touch("t." + e.target.dataset.t + ".p." + e.target.dataset.p);
  });
  const pool = document.getElementById("pool");
  if (pool) pool.oninput = e => {
    S.pool = e.target.value;
    const n = poolNames().length;
    const c = document.getElementById("poolCount");
    c.textContent = n + (n===1?" name":" names") + (n===20 ? " — full field" : "");
    c.classList.toggle("full", n===20);
    touch("pool");
  };
  const pull2 = document.getElementById("pullNames");
  if (pull2) pull2.onclick = () => {
    const all = S.teams.flatMap(t => t.players).filter(Boolean);
    if (!all.length) { poolMsg("No names on the teams yet."); return; }
    S.pool = all.join("\n"); touch("pool"); render();
    poolMsg("Loaded " + all.length + " names back into the pool.");
  };
  const draw = document.getElementById("draw");
  if (draw) draw.onclick = () => {
    const names = poolNames();
    if (names.length < 2) { poolMsg("Add at least two names to the pool first."); return; }
    const filled = S.teams.some(t => t.players.some(Boolean));
    const go = () => {
      for (let i = names.length-1; i > 0; i--){
        const j = Math.floor(Math.random()*(i+1));
        const tmp = names[i]; names[i] = names[j]; names[j] = tmp;
      }
      const buckets = S.teams.map(() => []);
      names.forEach((nm,i) => buckets[i % S.teams.length].push(nm));
      S.teams.forEach((t,i) => {
        const b = buckets[i];
        while (b.length < 4) b.push("");
        t.players = b;
      });
      const flds = ["pool"];
      S.teams.forEach((t,i) => t.players.forEach((_,j) => flds.push("t."+i+".p."+j)));
      touch.apply(null, flds); render();
      poolMsg(names.length + " names dealt into " + S.teams.length + " teams.");
    };
    if (filled) arm(draw, "Redraw?", go); else go();
  };
  const rs = document.getElementById("reset");
  if (rs) rs.onclick = () => arm(rs, "Wipe everything?", () => {
    const keep = S.V;
    S = blank();
    S.V = keep;
    activeGame = liveGames()[0].id;
    const flds = ["title","pool","golfRules"];
    IDS.forEach(id => flds.push("golf."+id));
    S.golfPoints.forEach((_,i) => flds.push("gp."+i));
    S.teams.forEach((t,i) => { flds.push("t."+i+".name"); t.players.forEach((_,j)=>flds.push("t."+i+".p."+j)); });
    Object.keys(S.V).forEach(f => { if (f.indexOf("g.") === 0) flds.push(f); });
    S.games.forEach(g => { flds.push("g."+g.id+".del","g."+g.id+".name"); });
    touch.apply(null, flds); render();
  });
}

document.querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
document.getElementById("helpBtn").onclick = () => { helpOpen = !helpOpen; render(); };
document.getElementById("switchBtn").onclick = leaveBoard;
document.getElementById("title").oninput = e => { S.title = e.target.value; touch("title"); };

/* ---------------- boot + sync ---------------- */
let lastSync = 0;

async function sync(){
  if (!SHARED || gated || flushing) return;
  const remote = await pull();
  lastSync = Date.now();
  if (!remote){ netOk = false; setStatus(); return; }
  netOk = true;
  const res = merge(S, remote);
  S = res.state;
  if (res.changed){
    saveLocal();
    if (typing()) needsRender = true; else render();
  }
  if (dirty || aheadOf(remote)) flush();
  else setStatus();
}

/* Apply any update that arrived while someone was mid-keystroke. */
function drainRender(){
  if (needsRender && !typing()){ needsRender = false; render(); }
}

function tickLive(){
  const el = document.getElementById("liveTime");
  if (!el) return;
  if (!SHARED){ el.textContent = "local"; return; }
  if (!netOk){ el.textContent = "offline"; return; }
  if (dirty){ el.textContent = "syncing"; return; }
  if (!lastSync){ el.textContent = "live"; return; }
  const s = Math.round((Date.now() - lastSync) / 1000);
  el.textContent = s < 8 ? "live" : s < 60 ? s + "s ago" : Math.round(s/60) + "m ago";
}

function shareMsg(t){
  const el = document.getElementById("shareMsg");
  if (el) el.textContent = t;
}

function wireShare(){
  const btn = document.getElementById("share");
  btn.onclick = async () => {
    if (!SHARED){ shareMsg("No shared board yet — reload the page to create one."); return; }
    const url = location.href;
    try {
      await navigator.clipboard.writeText(url);
      shareMsg("Link copied. Send it to the group.");
      return;
    } catch(e){ /* clipboard blocked — show it instead */ }
    if (document.getElementById("shareUrl")) return;
    const inp = document.createElement("input");
    inp.className = "share-url"; inp.id = "shareUrl"; inp.value = url; inp.readOnly = true;
    document.querySelector(".share-row").appendChild(inp);
    inp.focus(); inp.select();
    shareMsg("Copy this link:");
  };
}

(async () => {
  const cached = localStorage.getItem(KEY);
  if (cached){ const n = normalize(JSON.parse(cached)); if (n) S = n; }

  if (boardId){
    const remote = await pull();
    if (remote){
      gated = false; SHARED = true; S = remote; setBoardId(boardId);
    } else {
      gated = true;            // keyword not found, or offline — let them choose
      boardId = "";
    }
  } else {
    /* No board ID. Never create one automatically — that would strand an
       existing tournament. Ask instead. */
    gated = true;
  }

  activeGame = (liveGames()[0]||{}).id || "g1";
  lastSync = Date.now();
  if (!SHARED) document.getElementById("liveTime").textContent = "local";
  render();
  wireShare();
  document.getElementById("live").onclick = () => {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    sync();
  };
  setInterval(sync, 3000);
  setInterval(() => { if (dirty && !flushing) flush(); }, 4000);   // keep retrying until it lands
  setInterval(drainRender, 700);
  window.addEventListener("online", () => { netOk = true; sync(); });
  window.addEventListener("offline", () => { netOk = false; setStatus(); });
  window.addEventListener("pagehide", () => { if (dirty) flush(); });
  setInterval(tickLive, 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); });
  window.addEventListener("focus", sync);

  if ("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  }
})();
</script>
